name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ["8.2", "8.3"]

    services:
      mariadb:
        image: mariadb:10.5.8
        # MYSQL_* names, not MARIADB_*: the 10.5.8 image's entrypoint only reads
        # the former ("Database is uninitialized and password option is not
        # specified" was why every CI run since August failed to start the
        # service). Same names docker-compose.yml uses for this image. The
        # image also predates healthcheck.sh, so probe with mysqladmin.
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: db_test
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, json, mysqlnd
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Configure environment
        run: |
          # No CI_ENVIRONMENT=testing here: PHPUnit's bootstrap sets the
          # testing environment itself, while `spark` under that environment
          # expects PHPUnit-only constants (SUPPORTPATH) and dies. Migrations
          # run in the development environment against the `tests` DB group.
          cp env .env
          echo "" >> .env
          echo "database.default.hostname=127.0.0.1" >> .env
          echo "database.default.database=db_test" >> .env
          echo "database.default.username=user" >> .env
          echo "database.default.password=password" >> .env
          echo "database.default.DBDriver=MySQLi" >> .env
          echo "database.default.port=3306" >> .env
          echo "database.tests.hostname=127.0.0.1" >> .env
          echo "database.tests.database=db_test" >> .env
          echo "database.tests.username=user" >> .env
          echo "database.tests.password=password" >> .env
          echo "database.tests.DBDriver=MySQLi" >> .env
          echo "database.tests.DBPrefix=" >> .env
          echo "database.tests.port=3306" >> .env
          echo "API_KEY=your-secret-key-here" >> .env

      - name: Run migrations
        run: php spark migrate --all -g tests

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage
